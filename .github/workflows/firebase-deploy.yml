name: Deploy StudyPilot AI Firebase backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Create Firebase service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub Actions secret: FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Create backend environment
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Missing GitHub Actions secret: OPENROUTER_API_KEY"
            exit 1
          fi
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" > functions/.env

      - name: Deploy Firebase Function
        run: npx firebase-tools deploy --only functions:api --project studypilot-ai-ac864 --non-interactive

      - name: Remove temporary credentials
        if: always()
        run: rm -f /tmp/firebase-service-account.json functions/.env
