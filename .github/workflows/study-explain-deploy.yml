name: Deploy StudyPilot AI backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set OpenRouter secret on Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Missing required GitHub Actions secrets. Add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and OPENROUTER_API_KEY in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          supabase secrets set OPENROUTER_API_KEY="$OPENROUTER_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy study-explain --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
