name: Android Build

on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare StudyPilot AI logo from repository image
        run: |
          git fetch origin main --depth=1
          mkdir -p /tmp/studypilot-logo
          git show origin/main:file_00000000567081f4a05fb87d45adc140.png > /tmp/studypilot-logo/source.png
          python3 -m venv /tmp/studypilot-logo-venv
          /tmp/studypilot-logo-venv/bin/pip install Pillow
          /tmp/studypilot-logo-venv/bin/python .github/scripts/crop_studypilot_logo.py /tmp/studypilot-logo/source.png android/app/src/main/res/drawable-nodpi/studypilot_logo.png

      - name: Configure Supabase endpoint for this build (optional until secrets are added)
        working-directory: android/app/src/main/java/com/narendar/hub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("AiConfig.kt")
          text = path.read_text()
          url = os.environ.get("SUPABASE_URL", "").strip()
          key = os.environ.get("SUPABASE_PUBLISHABLE_KEY", "").strip()
          if url and key:
              text = text.replace('https://YOUR_PROJECT_REF.supabase.co', url.rstrip('/'))
              text = text.replace('YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY', key)
              path.write_text(text)
              print("Supabase app configuration injected for this build.")
          else:
              print("Supabase GitHub secrets are not set; APK will build with AI setup instructions.")
          PY

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NarendarHub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
