name: Android Build
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Production backend URL, e.g. https://studypilot-api.onrender.com'
        required: true
        type: string
  push:
    paths: ['android/**']
  pull_request:
    paths: ['android/**']
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STUDYPILOT_API_BASE_URL: ${{ inputs.api_base_url || 'http://10.0.2.2:8000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyPilot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
