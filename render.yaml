services:
  - type: web
    name: studypilot-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: ACCESS_TOKEN_MINUTES
        value: 10080
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5-mini
      - key: DATABASE_URL
        fromDatabase:
          name: studypilot-db
          property: connectionString

databases:
  - name: studypilot-db
    databaseName: studypilot
    plan: free
